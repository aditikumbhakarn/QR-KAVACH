/* =====================================================
   CAMERA
===================================================== */

async function startCamera() {

    try {

        if (scanning) {
            return;
        }


        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "environment"
                },

                audio: false

            });


        video =
            document.createElement("video");


        video.setAttribute(
            "playsinline",
            true
        );


        video.autoplay = true;


        video.srcObject =
            stream;


        document.getElementById("reader")
            .innerHTML = "";


        document.getElementById("reader")
            .appendChild(video);


        await video.play();


        scanning = true;


        scanCamera();

    }

    catch(error) {

        alert(t.cameraError);

        console.log(error);

    }

}


/* =====================================================
   CAMERA SCAN
===================================================== */

function scanCamera() {

    if (
        !scanning ||
        !video
    ) {
        return;
    }


    if (
        video.readyState ===
        video.HAVE_ENOUGH_DATA
    ) {

        const canvas =
            document.createElement("canvas");


        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        const ctx =
            canvas.getContext("2d");


        ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );


        const imageData =
            ctx.getImageData(
                0,
                0,
                canvas.width,
                canvas.height
            );


        const code =
            jsQR(
                imageData.data,
                imageData.width,
                imageData.height,
                {
                    inversionAttempts:
                    "attemptBoth"
                }
            );


        if (code) {

            processQR(
                code.data
            );


            stopCamera();


            return;

        }

    }


    requestAnimationFrame(
        scanCamera
    );

}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera() {

    scanning = false;


    if (stream) {

        stream
            .getTracks()
            .forEach(track => {

                track.stop();

            });


        stream = null;

    }


    if (video) {

        video.srcObject = null;

        video.remove();

        video = null;

    }

}

/* =====================================================
   QR TYPE DETECTION
===================================================== */

function detectQRType(data) {

    const lower =
        data.toLowerCase();


    if (
        lower.startsWith("upi://pay")
    ) {

        return "💳 UPI Payment";

    }


    if (
        lower.startsWith("wifi:")
    ) {

        return "📶 Wi-Fi";

    }


    if (
        lower.includes("begin:vcard") ||
        lower.includes("begin:vcalendar")
    ) {

        if (
            lower.includes("vcard")
        ) {

            return "👤 Contact / vCard";

        }

        return "📅 Calendar / Event";

    }


    if (
        lower.startsWith("mailto:") ||
        lower.includes("mailto:")
    ) {

        return "📧 Email";

    }


    if (
        lower.startsWith("tel:") ||
        lower.match(
            /^\+?[0-9]{8,15}$/
        )
    ) {

        return "☎️ Phone Number";

    }


    if (
        lower.startsWith("sms:") ||
        lower.startsWith("smsto:")
    ) {

        return "💬 SMS";

    }


    if (
        lower.startsWith("geo:") ||
        lower.includes("maps.google.")
    ) {

        return "📍 Location / GPS";

    }


    if (
        lower.includes("wa.me") ||
        lower.includes("whatsapp.com")
    ) {

        return "💬 WhatsApp";

    }


    if (
        lower.includes("t.me/") ||
        lower.includes("telegram.me/")
    ) {

        return "✈️ Telegram";

    }


    if (
        lower.includes("youtube.com") ||
        lower.includes("youtu.be")
    ) {

        return "▶️ YouTube";

    }


    if (
        lower.includes("instagram.com")
    ) {

        return "📸 Instagram";

    }


    if (
        lower.includes("facebook.com") ||
        lower.includes("fb.me")
    ) {

        return "📘 Facebook";

    }


    if (
        lower.includes("play.google.com")
    ) {

        return "📲 Google Play Store";

    }


    if (
        lower.includes("apps.apple.com")
    ) {

        return "🍎 Apple App Store";

    }


    if (
        lower.startsWith("event:") ||
        lower.includes("begin:vevent")
    ) {

        return "📅 Event / Calendar";

    }


    if (
        lower.startsWith("http://") ||
        lower.startsWith("https://")
    ) {

        return "🌐 Website / URL";

    }


    return "📝 Plain Text";

}


/* =====================================================
   QR DETAILS
===================================================== */

function getQRDetails(
    data,
    type
) {

    let html = "";

    const lower =
        data.toLowerCase();


    if (
        type.includes("UPI")
    ) {

        const params =
            new URLSearchParams(
                data.split("?")[1] || ""
            );


        const upiId =
            params.get("pa");


        const name =
            params.get("pn");


        const amount =
            params.get("am");


        if (upiId) {

            html += `
                <div class="info-row">
                    <strong>UPI ID:</strong>
                    ${escapeHTML(upiId)}
                </div>
            `;

        }


        if (name) {

            html += `
                <div class="info-row">
                    <strong>Payee Name:</strong>
                    ${escapeHTML(name)}
                </div>
            `;

        }


        if (amount) {

            html += `
                <div class="info-row">
                    <strong>Amount:</strong>
                    ₹${escapeHTML(amount)}
                </div>
            `;

        }


        html += `
            <div class="info-row">
                Payment QR detected.
                Check the receiver details
                before paying.
            </div>
        `;


        return html;

    }


    if (
        type.includes("Wi-Fi")
    ) {

        const ssidMatch =
            data.match(
                /S:([^;]*)/i
            );


        const passwordMatch =
            data.match(
                /P:([^;]*)/i
            );


        const securityMatch =
            data.match(
                /T:([^;]*)/i
            );


        if (ssidMatch) {

            html += `
                <div class="info-row">
                    <strong>Network:</strong>
                    ${escapeHTML(
                        ssidMatch[1]
                    )}
                </div>
            `;

        }


        if (securityMatch) {

            html += `
                <div class="info-row">
                    <strong>Security:</strong>
                    ${escapeHTML(
                        securityMatch[1]
                    )}
                </div>
            `;

        }


        if (passwordMatch) {

            html += `
                <div class="info-row">
                    <strong>Password:</strong>
                    QR contains a Wi-Fi password.
                </div>
            `;

        }


        return html;

    }


    if (
        type.includes("Contact")
    ) {

        const name =
            data.match(
                /FN:([^\n\r]*)/i
            );


        const phone =
            data.match(
                /TEL[^:]*:([^\n\r]*)/i
            );


        const email =
            data.match(
                /EMAIL[^:]*:([^\n\r]*)/i
            );


        if (name) {

            html += `
                <div class="info-row">
                    <strong>Name:</strong>
                    ${escapeHTML(name[1])}
                </div>
            `;

        }


        if (phone) {

            html += `
                <div class="info-row">
                    <strong>Phone:</strong>
                    ${escapeHTML(phone[1])}
                </div>
            `;

        }


        if (email) {

            html += `
                <div class="info-row">
                    <strong>Email:</strong>
                    ${escapeHTML(email[1])}
                </div>
            `;

        }


        return html;

    }


    if (
        type.includes("Email")
    ) {

        return `
            <div class="info-row">
                <strong>
                    Email information detected.
                </strong>
            </div>
        `;

    }


    if (
        type.includes("Phone")
    ) {

        return `
            <div class="info-row">
                <strong>
                    Phone number detected.
                </strong>
            </div>
        `;

    }


    if (
        type.includes("SMS")
    ) {

        return `
            <div class="info-row">
                <strong>
                    SMS message information detected.
                </strong>
            </div>
        `;

    }


    if (
        type.includes("Location")
    ) {

        return `
            <div class="info-row">
                <strong>
                    Location / GPS information detected.
                </strong>
            </div>
        `;

    }


    if (
        type.includes("WhatsApp") ||
        type.includes("Telegram") ||
        type.includes("YouTube") ||
        type.includes("Instagram") ||
        type.includes("Facebook")
    ) {

        return `
            <div class="info-row">
                <strong>
                    Social / communication link detected.
                </strong>
            </div>
        `;

    }


    if (
        type.includes("Website")
    ) {

        let domain = "";


        try {

            domain =
                new URL(data).hostname;

        }

        catch(e) {

            domain =
                "Unknown";

        }


        return `
            <div class="info-row">
                <strong>
                    Website Domain:
                </strong>

                ${escapeHTML(domain)}

            </div>
        `;

    }


    return `
        <div class="info-row">
            Plain text information detected.
        </div>
    `;

}


/* =====================================================
   SECURITY ANALYSIS
===================================================== */

function analyseSecurity(
    data,
    type
) {

    let score = 95;

    let reasons = [];


    const lower =
        data.toLowerCase();


    if (
        lower.startsWith("https://")
    ) {

        reasons.push(
            "HTTPS connection detected."
        );

    }


    if (
        lower.startsWith("http://")
    ) {

        score -= 20;


        reasons.push(
            "HTTP connection is not encrypted."
        );

    }


    if (
        /https?:\/\/\d{1,3}(\.\d{1,3}){3}/
        .test(data)
    ) {

        score -= 20;


        reasons.push(
            "URL uses a direct IP address."
        );

    }


    if (
        lower.includes("@") &&
        (
            lower.startsWith("http://") ||
            lower.startsWith("https://")
        )
    ) {

        score -= 20;


        reasons.push(
            "URL contains @ symbol."
        );

    }


    const suspiciousWords = [

        "login",
        "verify",
        "urgent",
        "winner",
        "prize",
        "free",
        "claim",
        "password",
        "account",
        "gift",
        "reward",
        "kyc"

    ];


    let foundWord = false;


    suspiciousWords.forEach(
        word => {

            if (
                lower.includes(word) &&
                !foundWord
            ) {

                score -= 8;


                reasons.push(
                    "Suspicious keyword detected: " +
                    word
                );


                foundWord = true;

            }

        }
    );


    if (
        data.length > 180
    ) {

        score -= 10;


        reasons.push(
            "QR content is unusually long."
        );

    }


    if (
        type.includes("UPI")
    ) {

        reasons.push(
            "UPI payment QR detected. Verify receiver details before payment."
        );

    }


    if (
        type.includes("Wi-Fi")
    ) {

        reasons.push(
            "Wi-Fi credentials are present in this QR."
        );

    }


    if (
        type.includes("WhatsApp")
    ) {

        reasons.push(
            "WhatsApp link detected. Check the invite/link before opening."
        );

    }


    score =
        Math.max(
            0,
            Math.min(
                100,
                score
            )
        );


    return {

        score: score,

        reasons: reasons

    };

}


/* =====================================================
   PROCESS QR
===================================================== */

function processQR(data) {

    currentContent = data;


    const type =
        detectQRType(data);


    const details =
        getQRDetails(
            data,
            type
        );


    const analysis =
        analyseSecurity(
            data,
            type
        );


    document.getElementById(
        "resultCard"
    ).style.display = "block";


    document.getElementById(
        "qrType"
    ).textContent = type;


    document.getElementById(
        "details"
    ).innerHTML = details;


    document.getElementById(
        "qrContent"
    ).innerHTML =
        "<div class='info-row'>" +
        escapeHTML(data) +
        "</div>";


    document.getElementById(
        "score"
    ).textContent =
        analysis.score + "%";


    let statusHTML = "";

    let statusClass = "";


    if (
        analysis.score >= 75
    ) {

        statusHTML =
            "🟢 <strong>" +
            t.safe +
            "</strong>";


        statusClass =
            "safe";

    }


    else if (
        analysis.score >= 45
    ) {

        statusHTML =
            "🟠 <strong>" +
            t.suspicious +
            "</strong>";


        statusClass =
            "suspicious";

    }


    else {

        statusHTML =
            "🔴 <strong>" +
            t.dangerous +
            "</strong>";


        statusClass =
            "dangerous";

    }


    document.getElementById(
        "securityStatus"
    ).className =
        statusClass;


    document.getElementById(
        "securityStatus"
    ).innerHTML =
        statusHTML;


    let reasonHTML = "";


    analysis.reasons.forEach(
        reason => {

            reasonHTML += `
                <div class="info-row">
                    • ${escapeHTML(reason)}
                </div>
            `;

        }
    );


    if (
        analysis.reasons.length === 0
    ) {

        reasonHTML = `
            <div class="success">
                No obvious suspicious pattern
                was detected.
            </div>
        `;

    }


    document.getElementById(
        "reasons"
    ).innerHTML =
        reasonHTML;


    const openButton =
        document.getElementById(
            "openButton"
        );


    currentLink = "";


    if (
        lowerURL(data)
    ) {

        currentLink =
            data;


        openButton.style.display =
            "inline-block";


        openButton.textContent =
            t.open;

    }


    else {

        openButton.style.display =
            "none";

    }


    const warningBox =
        document.getElementById(
            "warningBox"
        );


    if (
        analysis.score < 45
    ) {

        warningBox.innerHTML = `

            <div class="warning danger-warning">

                ⚠️
                <strong>
                    ${t.dangerous}
                </strong>

                <br>

                Do not open or enter
                personal information until
                you verify this QR.

            </div>

        `;

    }


    else {

        warningBox.innerHTML = `

            <div class="warning">

                ℹ️
                ${t.basicWarning}

            </div>

        `;

    }


    saveScanHistory(
        data,
        type,
        analysis.score
    );


    window.scrollTo({

        top:
            document.getElementById(
                "resultCard"
            ).offsetTop,

        behavior:
            "smooth"

    });

}


/* =====================================================
   SAVE SCAN HISTORY
===================================================== */

function saveScanHistory(
    data,
    type,
    score
) {

    let history =
        JSON.parse(
            localStorage.getItem(
                "qrScanHistory"
            )
        ) || [];


    let status;


    if (
        score >= 75
    ) {

        status =
            "SAFE";

    }

    else if (
        score >= 45
    ) {

        status =
            "SUSPICIOUS";

    }

    else {

        status =
            "DANGEROUS";

    }


    const scan = {

        content: data,

        type: type,

        score: score,

        status: status,

        date:
            new Date()
            .toLocaleString()

    };


    history.unshift(
        scan
    );


    history =
        history.slice(
            0,
            20
        );


    localStorage.setItem(

        "qrScanHistory",

        JSON.stringify(
            history
        )

    );


    console.log(
        t.historySaved
    );

}


/* =====================================================
   URL CHECK
===================================================== */

function lowerURL(data) {

    return (

        data.startsWith(
            "http://"
        ) ||

        data.startsWith(
            "https://"
        )

    );

}


/* =====================================================
   COPY CONTENT
===================================================== */

function copyContent() {

    if (
        !currentContent
    ) {

        return;

    }


    navigator.clipboard
        .writeText(
            currentContent
        )
        .then(() => {

            alert(
                t.copied
            );

        });

}


/* =====================================================
   OPEN LINK
===================================================== */

function openLink() {

    if (
        !currentLink
    ) {

        return;

    }


    window.open(

        currentLink,

        "_blank",

        "noopener,noreferrer"

    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   BACK TO DASHBOARD
===================================================== */

function goBack() {

    window.location.href =
        "dashboard.html";

}
